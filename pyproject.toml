[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "occupational-health-research-bot"
version = "0.1.0"
description = "Source-linked Japanese occupational health research briefs"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
research-brief = "research_bot.cli:main"

[tool.setuptools.packages.find]
include = ["research_bot*"]
